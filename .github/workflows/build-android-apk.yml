name: Build & Publish Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Signed APK & Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls -la "$SDK_DIR"
          ls -la "$SDK_DIR/build-tools" || true

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Generate Android project via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure version, permissions, fullscreen WebView, Google OAuth popups, and icons
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: node .github/scripts/configure-android.mjs

      - name: Build & Sign Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          VERSION=$(node -e 'console.log(require("./public/version.json").version || "2.8.0")')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;35.0.0"
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fi
          mkdir -p ../release-apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            KS_PASS="${ANDROID_KEYSTORE_PASS:-spystation}"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-spystation}"
            KEY_PASS="${ANDROID_KEY_PASS:-$KS_PASS}"
          else
            KS_PASS="spystation123"
            KS_ALIAS="spystation"
            KEY_PASS="spystation123"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Spy Station, O=SpyStation, C=EG"
          fi

          keytool -list -v -keystore release.keystore -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -E "SHA1:|SHA256:" || true

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "../release-apk/SpyStation.apk" \
            app-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify "../release-apk/SpyStation.apk"
          cp "../release-apk/SpyStation.apk" "../release-apk/SpyStation-v${VERSION}.apk"
          rm -f release.keystore app-aligned.apk

      - name: Clean old APK artifacts and upload latest APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_ARTIFACT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)
          for aid in $OLD_ARTIFACT_IDS; do
            echo "Deleting old workflow artifact ID: $aid"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" >/dev/null 2>&1 || true
          done

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyStation-APK-v${{ env.APP_VERSION }}-${{ github.run_number }}
          path: release-apk/SpyStation.apk
          retention-days: 14

      - name: Replace old GitHub Releases and publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          for tag in $OLD_TAGS; do
            echo "Removing previous release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          NEW_TAG="v${APP_VERSION}-b${{ github.run_number }}"
          gh release create "$NEW_TAG" \
            "release-apk/SpyStation.apk" \
            "release-apk/SpyStation-v${APP_VERSION}.apk" \
            --title "Spy Station Android APK v${APP_VERSION} (Build ${{ github.run_number }})" \
            --notes "Latest signed Android APK for Spy Station v${APP_VERSION} (compatible with APKPure, itch.io, and direct install). Previous APK releases were automatically cleaned up." \
            --latest

      - name: Publish & Replace APK on itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          TARGET="${ITCH_TARGET:-hamza-hussien/spy-station:android}"
          if [ -n "$BUTLER_API_KEY" ]; then
            curl -L -sSf -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -q butler.zip -d butler-bin
            chmod +x butler-bin/butler
            ./butler-bin/butler push "release-apk/SpyStation.apk" "$TARGET" --userversion "$APP_VERSION"
          else
            echo "BUTLER_API_KEY secret is not configured!"
            exit 1
          fi
