name: Build & Publish Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Signed APK & Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          ls -la "$SDK_DIR"
          ls -la "$SDK_DIR/build-tools" || true

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web bundle
        run: npm run build

      - name: Generate Android project via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure version, permissions, fullscreen WebView, Google OAuth popups, and icons
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const versionInfo = JSON.parse(fs.readFileSync("public/version.json", "utf8"));
            const versionName = versionInfo.version || "2.6.1";
            const buildNum = Number(process.env.BUILD_NUM || 1);

            // 1. Update build.gradle versionCode & versionName
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + buildNum);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, "versionName \"" + versionName + "\"");
            fs.writeFileSync(gradlePath, gradle);

            // 2. Add WebRTC voice, network & wake-lock permissions to AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let manifest = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.WAKE_LOCK"
            ];
            for (const p of perms) {
              if (!manifest.includes(p)) {
                manifest = manifest.replace(
                  "<application",
                  `    <uses-permission android:name="${p}" />\n    <application`
                );
              }
            }
            fs.writeFileSync(manifestPath, manifest);

            // 3. Configure styles.xml for edge-to-edge dark cosmic fullscreen without cutout black bars
            const stylesPath = "android/app/src/main/res/values/styles.xml";
            if (fs.existsSync(stylesPath)) {
              let styles = fs.readFileSync(stylesPath, "utf8");
              if (!styles.includes("windowLayoutInDisplayCutoutMode")) {
                styles = styles.replace(
                  "</style>",
                  "        <item name=\"android:windowFullscreen\">true</item>\n" +
                  "        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>\n" +
                  "        <item name=\"android:statusBarColor\">#030712</item>\n" +
                  "        <item name=\"android:navigationBarColor\">#030712</item>\n" +
                  "        <item name=\"android:windowBackground\">#030712</item>\n" +
                  "    </style>"
                );
                fs.writeFileSync(stylesPath, styles);
              }
            }

            // 4. Write enhanced MainActivity.java for Immersive Sticky Fullscreen, zero scrollbars/overscroll, clean Chrome UA, 3P cookies & OAuth popup Dialog support
            const mainActivityPath = "android/app/src/main/java/com/spystation/game/MainActivity.java";
            const mainActivityJava = `package com.spystation.game;

import android.app.Dialog;
import android.graphics.Color;
import android.os.Build;
import android.os.Bundle;
import android.os.Message;
import android.view.View;
import android.view.ViewGroup;
import android.view.WindowManager;
import android.webkit.CookieManager;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebResourceRequest;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.core.view.WindowCompat;
import androidx.core.view.WindowInsetsCompat;
import androidx.core.view.WindowInsetsControllerCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    private String buildCleanChromeUserAgent(String rawUa) {
        if (rawUa == null || rawUa.isEmpty()) return rawUa;
        return rawUa
            .replace("; wv)", ")")
            .replace("; wv;", ";")
            .replace("Version/4.0 ", "");
    }

    private void applyImmersiveFullscreen() {
        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
            WindowManager.LayoutParams lp = getWindow().getAttributes();
            lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
            getWindow().setAttributes(lp);
        }
        WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
        if (controller != null) {
            controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            controller.hide(WindowInsetsCompat.Type.systemBars());
        }
        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
            getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
            );
        }
    }

    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        applyImmersiveFullscreen();

        final WebView webView = getBridge().getWebView();
        if (webView == null) return;

        webView.setBackgroundColor(Color.parseColor("#030712"));
        webView.setVerticalScrollBarEnabled(false);
        webView.setHorizontalScrollBarEnabled(false);
        webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

        WebSettings settings = webView.getSettings();
        settings.setDomStorageEnabled(true);
        settings.setJavaScriptCanOpenWindowsAutomatically(true);
        settings.setSupportMultipleWindows(true);
        final String cleanUa = buildCleanChromeUserAgent(settings.getUserAgentString());
        if (cleanUa != null) {
            settings.setUserAgentString(cleanUa);
        }

        CookieManager cookieManager = CookieManager.getInstance();
        cookieManager.setAcceptCookie(true);
        cookieManager.setAcceptThirdPartyCookies(webView, true);

        final WebChromeClient origChrome = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
            ? webView.getWebChromeClient()
            : null;

        webView.setWebChromeClient(new WebChromeClient() {
            @Override
            public void onPermissionRequest(final PermissionRequest request) {
                if (origChrome != null) {
                    origChrome.onPermissionRequest(request);
                } else {
                    runOnUiThread(() -> request.grant(request.getResources()));
                }
            }

            @Override
            public boolean onShowFileChooser(WebView view, android.webkit.ValueCallback<android.net.Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                if (origChrome != null) {
                    return origChrome.onShowFileChooser(view, filePathCallback, fileChooserParams);
                }
                return super.onShowFileChooser(view, filePathCallback, fileChooserParams);
            }

            @Override
            public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                final Dialog popupDialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                final WebView popupWebView = new WebView(MainActivity.this);
                popupWebView.setLayoutParams(new ViewGroup.LayoutParams(
                    ViewGroup.LayoutParams.MATCH_PARENT,
                    ViewGroup.LayoutParams.MATCH_PARENT
                ));

                WebSettings pSettings = popupWebView.getSettings();
                pSettings.setJavaScriptEnabled(true);
                pSettings.setDomStorageEnabled(true);
                pSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                pSettings.setSupportMultipleWindows(true);
                if (cleanUa != null) {
                    pSettings.setUserAgentString(cleanUa);
                }

                CookieManager cm = CookieManager.getInstance();
                cm.setAcceptCookie(true);
                cm.setAcceptThirdPartyCookies(popupWebView, true);
                cm.flush();

                popupWebView.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(WebView wv, WebResourceRequest req) {
                        return false;
                    }
                });

                popupWebView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onCloseWindow(WebView window) {
                        popupDialog.dismiss();
                    }
                });

                popupDialog.setContentView(popupWebView);
                popupDialog.setOnDismissListener(d -> {
                    CookieManager.getInstance().flush();
                    popupWebView.destroy();
                    applyImmersiveFullscreen();
                });
                popupDialog.show();

                WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                transport.setWebView(popupWebView);
                resultMsg.sendToTarget();
                return true;
            }
        });
    }

    @Override
    public void onResume() {
        super.onResume();
        applyImmersiveFullscreen();
    }

    @Override
    public void onWindowFocusChanged(boolean hasFocus) {
        super.onWindowFocusChanged(hasFocus);
        if (hasFocus) {
            applyImmersiveFullscreen();
        }
    }
}
`;
            fs.mkdirSync(path.dirname(mainActivityPath), { recursive: true });
            fs.writeFileSync(mainActivityPath, mainActivityJava);

            // 5. Install Spy Station icons across mipmap folders
            const anydpiDir = "android/app/src/main/res/mipmap-anydpi-v26";
            if (fs.existsSync(anydpiDir)) {
              fs.rmSync(anydpiDir, { recursive: true, force: true });
            }
            const iconMap = {
              "mipmap-mdpi": "public/pwa-96x96.png",
              "mipmap-hdpi": "public/pwa-144x144.png",
              "mipmap-xhdpi": "public/pwa-192x192.png",
              "mipmap-xxhdpi": "public/pwa-384x384.png",
              "mipmap-xxxhdpi": "public/pwa-512x512.png"
            };
            for (const [folder, src] of Object.entries(iconMap)) {
              const dir = path.join("android/app/src/main/res", folder);
              fs.mkdirSync(dir, { recursive: true });
              if (fs.existsSync(src)) {
                fs.copyFileSync(src, path.join(dir, "ic_launcher.png"));
                fs.copyFileSync(src, path.join(dir, "ic_launcher_round.png"));
              }
            }
            console.log("Configured Spy Station Android v" + versionName + " (build " + buildNum + ") with immersive fullscreen & OAuth popup WebView");
          '

      - name: Build & Sign Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          VERSION=$(node -e 'console.log(require("./public/version.json").version || "2.6.1")')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;35.0.0"
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          fi
          mkdir -p ../release-apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            KS_PASS="${ANDROID_KEYSTORE_PASS:-spystation}"
            KS_ALIAS="${ANDROID_KEY_ALIAS:-spystation}"
            KEY_PASS="${ANDROID_KEY_PASS:-$KS_PASS}"
          else
            KS_PASS="spystation123"
            KS_ALIAS="spystation"
            KEY_PASS="spystation123"
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "$KS_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Spy Station, O=SpyStation, C=EG"
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" app-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "../release-apk/SpyStation.apk" \
            app-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify "../release-apk/SpyStation.apk"
          cp "../release-apk/SpyStation.apk" "../release-apk/SpyStation-v${VERSION}.apk"
          rm -f release.keystore app-aligned.apk

      - name: Clean old APK artifacts and upload latest APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_ARTIFACT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id' || true)
          for aid in $OLD_ARTIFACT_IDS; do
            echo "Deleting old workflow artifact ID: $aid"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" >/dev/null 2>&1 || true
          done

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyStation-APK-v${{ env.APP_VERSION }}-${{ github.run_number }}
          path: release-apk/SpyStation.apk
          retention-days: 14

      - name: Replace old GitHub Releases and publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OLD_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          for tag in $OLD_TAGS; do
            echo "Removing previous release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          NEW_TAG="v${APP_VERSION}-b${{ github.run_number }}"
          gh release create "$NEW_TAG" \
            "release-apk/SpyStation.apk" \
            "release-apk/SpyStation-v${APP_VERSION}.apk" \
            --title "Spy Station Android APK v${APP_VERSION} (Build ${{ github.run_number }})" \
            --notes "Latest signed Android APK for Spy Station v${APP_VERSION} (compatible with APKPure, itch.io, and direct install). Previous APK releases were automatically cleaned up." \
            --latest

      - name: Publish & Replace APK on itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}
        run: |
          TARGET="${ITCH_TARGET:-hamza-hussien/spy-station:android}"
          if [ -n "$BUTLER_API_KEY" ]; then
            curl -L -sSf -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            unzip -q butler.zip -d butler-bin
            chmod +x butler-bin/butler
            ./butler-bin/butler push "release-apk/SpyStation.apk" "$TARGET" --userversion "$APP_VERSION"
          else
            echo "BUTLER_API_KEY secret is not configured!"
            exit 1
          fi
