<!doctype html>
<html lang="en" dir="ltr" style="background-color:#030712">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Spy Station - Online Social Deduction Game</title>
    <meta name="description" content="Spy Station is an online multiplayer social deduction game with public and private rooms, friends, live voice chat, voting, and AI bots." />
    <meta property="og:title" content="Spy Station - Online Social Deduction Game" />
    <meta property="og:description" content="Spy Station is an online multiplayer social deduction game with public and private rooms, friends, live voice chat, voting, and AI bots." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spy Station" />
    <meta name="application-name" content="Spy Station" />
    
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function(reg) {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Chakra+Petch:wght@500;700;900&family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#030712] text-slate-100 h-[100dvh] w-full overflow-hidden overscroll-none selection:bg-sky-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
