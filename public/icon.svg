<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="domeGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background full solid fill for PWA adaptive masking -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="14 10" opacity="0.4"/>
  
  <!-- Stars in background -->
  <circle cx="120" cy="140" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="390" cy="120" r="2.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="370" cy="380" r="3" fill="#c084fc" opacity="0.7"/>
  <circle cx="130" cy="360" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="256" cy="100" r="2.5" fill="#38bdf8" opacity="0.8"/>

  <!-- Tractor beam -->
  <polygon points="210,320 302,320 340,430 172,430" fill="#38bdf8" opacity="0.18"/>
  <ellipse cx="256" cy="430" rx="84" ry="20" fill="#38bdf8" opacity="0.35" filter="url(#glow)"/>

  <!-- UFO Group -->
  <g transform="translate(0, -10)">
    <!-- Lower Saucer Rim -->
    <ellipse cx="256" cy="310" rx="170" ry="46" fill="url(#bodyGrad)" filter="url(#glow)"/>
    <ellipse cx="256" cy="298" rx="166" ry="42" fill="#0f172a"/>
    <ellipse cx="256" cy="292" rx="160" ry="38" fill="url(#bodyGrad)"/>

    <!-- Glass Cockpit Dome -->
    <ellipse cx="256" cy="235" rx="85" ry="72" fill="url(#domeGrad)"/>
    <!-- Dome highlight gloss -->
    <ellipse cx="230" cy="205" rx="28" ry="20" fill="#ffffff" opacity="0.65"/>

    <!-- Saucer Lights -->
    <circle cx="130" cy="305" r="10" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="190" cy="320" r="10" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="256" cy="325" r="11" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="322" cy="320" r="10" fill="#fef08a" filter="url(#glow)"/>
    <circle cx="382" cy="305" r="10" fill="#fef08a" filter="url(#glow)"/>
  </g>
</svg>
