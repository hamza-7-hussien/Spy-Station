<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spy Station</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: radial-gradient(circle at top, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    button {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #030712;
      border: none;
      padding: 14px 32px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 Spy Station</div>
    <div class="icon">🛰️📡</div>
    <h1>في انتظار إشارة الإنترنت</h1>
    <p>التطبيق جاهز ومحفوظ بالكامل على جهازك. سيتم الاتصال بالمحطة واستئناف اللعب تلقائياً بمجرد توفر الإنترنت.</p>
    <button onclick="window.location.reload()">إعادة المحاولة 🔄</button>
  </div>
</body>
</html>
